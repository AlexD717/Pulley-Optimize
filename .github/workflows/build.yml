name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows]
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Up GO
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'

    - name: Build the Binary
      run:
        GOOS=${{ matrix.os }} GOARCH=amd64 go build -o bin/encounter-manager-${{ matrix.os }}
